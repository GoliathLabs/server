version: 2
project_name: traggo
builds:
  - id: linux-amd64
    main: ./
    goos: [linux]
    goarch: ['amd64']
    flags: ['-tags="netgo osusergo sqlite_omit_load_extension"']
    ldflags: ["-s","-w","-linkmode","external","-extldflags","-static","-X main.BuildDate={{.Date}}","-X main.BuildMode=prod","-X main.BuildCommit={{.Commit}}","-X main.BuildVersion={{.Version}}"]
  - id: linux-arm64
    main: ./
    goos: [linux]
    goarch: [arm64]
    env: [CC=aarch64-linux-gnu-gcc, CXX=aarch64-linux-gnu-g++]
    flags: ['-tags="netgo osusergo sqlite_omit_load_extension"']
    ldflags: ["-s","-w","-linkmode","external","-extldflags","-static","-X main.BuildDate={{.Date}}","-X main.BuildMode=prod","-X main.BuildCommit={{.Commit}}","-X main.BuildVersion={{.Version}}"]
archives:
  - files:
      - LICENSE
      - README.md
      - .env.sample
checksum:
  disable: true
changelog:
  disable: true
dockers:
  - use: buildx
    goos: linux
    goarch: amd64
    ids: [linux-amd64]
    image_templates:
      - "ghcr.io/{{ .Env.GHCR_OWNER }}/server:amd64-{{ .Env.GHCR_TAG }}"
      - "ghcr.io/{{ .Env.GHCR_OWNER }}/server:amd64-{{ .ShortCommit }}"
    dockerfile: docker/Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
  - use: buildx
    goos: linux
    goarch: arm64
    ids: [linux-arm64]
    image_templates:
      - "ghcr.io/{{ .Env.GHCR_OWNER }}/server:arm64-{{ .Env.GHCR_TAG }}"
      - "ghcr.io/{{ .Env.GHCR_OWNER }}/server:arm64-{{ .ShortCommit }}"
    dockerfile: docker/Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
docker_manifests:
  - name_template: "ghcr.io/{{ .Env.GHCR_OWNER }}/server:{{ .Env.GHCR_TAG }}"
    image_templates:
      - "ghcr.io/{{ .Env.GHCR_OWNER }}/server:amd64-{{ .Env.GHCR_TAG }}"
      - "ghcr.io/{{ .Env.GHCR_OWNER }}/server:arm64-{{ .Env.GHCR_TAG }}"
  - name_template: "ghcr.io/{{ .Env.GHCR_OWNER }}/server:{{ .ShortCommit }}"
    image_templates:
      - "ghcr.io/{{ .Env.GHCR_OWNER }}/server:amd64-{{ .ShortCommit }}"
      - "ghcr.io/{{ .Env.GHCR_OWNER }}/server:arm64-{{ .ShortCommit }}"
